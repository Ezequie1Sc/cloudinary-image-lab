<div
  class="cil-lang-switcher"
  role="group"
  [attr.aria-label]="'accessibility.languageSwitcher' | translate"
>
  <svg lucideGlobe [size]="14" class="cil-lang-icon" aria-hidden="true"></svg>
  <button
    type="button"
    class="cil-lang-btn cil-focusable"
    [class.cil-lang-btn--active]="languageService.language() === 'en'"
    [attr.aria-pressed]="languageService.language() === 'en'"
    (click)="selectLanguage('en')"
  >
    EN
  </button>
  <span class="cil-lang-divider" aria-hidden="true">/</span>
  <button
    type="button"
    class="cil-lang-btn cil-focusable"
    [class.cil-lang-btn--active]="languageService.language() === 'es'"
    [attr.aria-pressed]="languageService.language() === 'es'"
    (click)="selectLanguage('es')"
  >
    ES
  </button>
</div>
