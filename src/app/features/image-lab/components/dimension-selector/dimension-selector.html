<fieldset class="cil-control-group">
  <legend class="cil-control-legend">
    <span>{{ 'transformations.dimensions.label' | translate }}</span>
    <span class="cil-control-token">{{ tokenLabel() }}</span>
  </legend>
  <p class="cil-control-hint">{{ 'transformations.dimensions.hint' | translate }}</p>

  <div class="cil-option-grid">
    @for (option of options; track option ?? 'original') {
      <button
        type="button"
        class="cil-option-btn cil-focusable"
        [class.cil-option-btn--active]="value() === option"
        [attr.aria-pressed]="value() === option"
        (click)="valueChange.emit(option)"
      >
        @if (option === null) {
          {{ 'transformations.dimensions.original' | translate }}
        } @else {
          {{ option }} px
        }
      </button>
    }
  </div>
</fieldset>
